# Example configuration for Web Traffic Bot
# Copy to config.yaml and edit as needed for your target site

# Single URL (simple)
target_url: "https://example.com"

# Multiple URLs with per-URL referrers (recommended for advanced use)
# Format: "url | referrer1, referrer2, ..."
# The referrers after | are used for ~80% of sessions to that URL.
# Leave out the | part to use the global 'referrers' list below.
# target_urls:
#   - "https://example.com | https://yourblog.com, https://twitter.com/"
#   - "https://example.com/blog | https://yourforum.com/thread/1"
#   - "https://example.com/contact"   # uses global referrers

# Total number of browser sessions to run
sessions_count: 10

# How many browser windows to run at the same time.
# Set to 1 for sequential (safe on low-memory servers).
# Set to 3-5 for faster traffic generation.
# Warning: each concurrent session uses ~200-400 MB RAM.
concurrent_sessions: 1

# How long each session stays on the page (seconds)
session_duration: 45

# Hard stop: bot stops after this many seconds regardless of sessions_count
duration_seconds: 600

# Optional proxy list (leave empty to run without proxies)
proxies: []
# proxies:
#   - "http://user:password@proxy1.example:8000"
#   - "http://user:password@proxy2.example:8000"

# Custom referrer URLs — traffic will appear to come from these sites (~80% of sessions).
# Add your own websites, blogs, forums, newsletters, etc.
# Leave empty to use only built-in search/social referrers (Google, Bing, etc.).
referrers: []
# referrers:
#   - "https://yourblog.com"
#   - "https://yourforum.com/thread/123"
#   - "https://yournewsletter.com/issue/42"

# Run browser without a visible window (required on servers)
headless: true

# Leave blank to auto-detect Chrome/Chromium
chromium_path: ""

# Directory where per-domain cookies are stored between sessions.
# Cookies make the bot look like a returning visitor and suppress consent banners.
# Leave blank to use the default: ~/.web-traffic-bot/cookies/
cookie_dir: ""
